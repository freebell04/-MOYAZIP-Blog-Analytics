<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>체험단 선정</title>
<link rel="stylesheet" href="style.css" />
<script src="file-open-guard.js"></script>
<style>
  body { max-width: 1100px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .pick-count { font-weight: 700; }
  table { width: 100%; border-collapse: collapse; background: var(--card); font-size: 13px; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--ink-soft); font-weight: 600; white-space: nowrap; }
  .score { font-weight: 800; font-size: 15px; }
  .score.hi { color: var(--green-dark); } .score.mid { color: #b7791f; } .score.lo { color: var(--danger); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--bg); }
  .tag.sel { background: var(--green-tint); color: var(--green-dark); font-weight: 700; }
  .tag.rej { background: #fdecec; color: var(--danger); }
  .muted { color: var(--ink-soft); font-size: 12px; }
  .reason { max-width: 260px; white-space: pre-wrap; }
  .keybox { font-family: monospace; font-size: 11px; word-break: break-all; background: var(--bg); padding: 6px 8px; border-radius: 8px; margin-top: 4px; }
  tr.dim td { opacity: .45; }
  .error { color: var(--danger); }
</style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center;margin:24px 0 8px">
  <h1 style="font-size:20px;margin:0">🎁 체험단 선정</h1>
  <a class="btn btn-outline" href="/">← 글쓰기 스튜디오</a>
</header>
<p class="hint">노션 「체험단 관리」 신청자의 블로그를 자동으로 확인해 <b>활동 점수</b>를 매겨요 (최근 30일 글 수 · 마지막 글 날짜 · Windows PC).
  점수를 참고해 <b><span id="goal">7</span>명</b>을 체크하고 [선정]을 누르면, 사람마다 <b>2주 사용 키</b>가 발급되고 노션에 선정·시작일·사용 키가 기록돼요.</p>

<div class="bar">
  <button id="load" class="btn btn-outline">🔄 신청자 불러오기 + 자동 심사</button>
  <span class="spacer" style="flex:1"></span>
  선정 목표 <input id="goal-input" type="number" min="1" value="7" style="width:60px" />명 ·
  <span>체크 <span class="pick-count" id="picked">0</span>명</span>
  <button id="select" class="btn btn-primary" disabled>✅ 체크한 사람 선정 + 키 발급</button>
</div>
<p id="status" class="status-line"></p>
<div id="results"></div>
<div style="overflow-x:auto"><table>
  <thead><tr><th></th><th>점수</th><th>이름 · 연락처</th><th>채널</th><th>블로그 활동</th><th>신청 이유</th><th>상태</th><th></th></tr></thead>
  <tbody id="rows"><tr><td colspan="8" class="muted">[신청자 불러오기]를 눌러주세요.</td></tr></tbody>
</table></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let list = [];
const picked = new Set();

fetch("/api/admin/is-admin").then((r) => r.json()).then((r) => {
  if (!r.admin) document.body.innerHTML = '<p style="margin-top:60px">관리자 컴퓨터에서만 열 수 있는 화면이에요.</p>';
});

function goal() { return Math.max(1, +$("#goal-input").value || 7); }
$("#goal-input").addEventListener("input", () => { $("#goal").textContent = goal(); renderCount(); });

function renderCount() {
  $("#picked").textContent = picked.size;
  $("#picked").style.color = picked.size === goal() ? "var(--green-dark)" : picked.size > goal() ? "var(--danger)" : "";
  $("#select").disabled = !picked.size;
}

function blogCell(a) {
  const b = a.blog || {};
  if (!a.blogUrl) return '<span class="muted">블로그 주소 없음</span>';
  const link = `<a href="${esc(a.blogUrl)}" target="_blank" rel="noopener">${esc(b.blogId || a.blogUrl)}</a>`;
  if (!b.ok) return `${link}<div class="error" style="font-size:12px">${esc(b.note || "확인 실패")}</div>`;
  return `${link}<div class="muted">최근 30일 글 ${b.recent30}개 · 마지막 글 ${b.lastDays == null ? "-" : b.lastDays === 0 ? "오늘" : b.lastDays + "일 전"}</div>${b.note ? `<div class="error" style="font-size:12px">${esc(b.note)}</div>` : ""}`;
}

function render() {
  $("#rows").innerHTML = list.length ? list.map((a) => {
    const done = a.selection === "선정";
    const cls = a.autoScore >= 60 ? "hi" : a.autoScore >= 30 ? "mid" : "lo";
    const tag = done ? `<span class="tag sel">선정</span><div class="muted">${esc(a.start || "")} ~ ${esc(a.end || "")}</div>` : a.selection === "탈락" ? '<span class="tag rej">탈락</span>' : '<span class="tag">대기</span>';
    return `<tr class="${a.selection === "탈락" ? "dim" : ""}">
      <td>${done ? "" : `<input type="checkbox" data-id="${a.id}" ${picked.has(a.id) ? "checked" : ""}>`}</td>
      <td><span class="score ${cls}">${a.autoScore}</span></td>
      <td><b>${esc(a.name)}</b><div class="muted">${esc(a.contact)}</div><div class="muted">${a.windows ? "💻 Windows" : "⚠ Windows 미확인"}</div></td>
      <td>${esc(a.channel)}</td>
      <td>${blogCell(a)}</td>
      <td class="reason">${esc(a.reason) || '<span class="muted">-</span>'}</td>
      <td>${tag}${done && a.key ? `<div class="keybox">${esc(a.key)}</div>` : ""}</td>
      <td>${done ? "" : a.selection === "탈락" ? `<button class="chip" data-status="대기" data-id="${a.id}">되돌리기</button>` : `<button class="chip" data-status="탈락" data-id="${a.id}">탈락</button>`}</td>
    </tr>`;
  }).join("") : '<tr><td colspan="8" class="muted">아직 신청자가 없어요.</td></tr>';
  renderCount();
}

$("#load").addEventListener("click", async () => {
  $("#load").disabled = true;
  $("#status").textContent = "노션에서 신청자를 불러오고, 신청자 블로그를 하나씩 확인하는 중이에요...";
  const r = await fetch("/api/admin/trial").then((r) => r.json()).catch((e) => ({ error: e.message }));
  $("#load").disabled = false;
  if (r.error) { $("#status").innerHTML = `<span class="error">⚠ ${esc(r.error)}</span>`; return; }
  list = r.applicants;
  picked.clear();
  const sel = list.filter((a) => a.selection === "선정").length;
  $("#status").textContent = `신청자 ${list.length}명 · 이미 선정 ${sel}명 · 점수 높은 순으로 정렬했어요.`;
  render();
});

document.addEventListener("change", (e) => {
  const cb = e.target.closest("input[data-id]");
  if (!cb) return;
  cb.checked ? picked.add(cb.dataset.id) : picked.delete(cb.dataset.id);
  renderCount();
});

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-status]");
  if (!b) return;
  await fetch("/api/admin/trial/status", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: b.dataset.id, value: b.dataset.status }) });
  const a = list.find((x) => x.id === b.dataset.id);
  if (a) a.selection = b.dataset.status;
  picked.delete(b.dataset.id);
  render();
});

$("#select").addEventListener("click", async () => {
  const names = list.filter((a) => picked.has(a.id)).map((a) => a.name);
  if (!confirm(`${names.length}명을 선정하고 2주 사용 키를 발급할까요?\n\n${names.join(", ")}\n\n노션에 선정·시작일(오늘)·사용 키가 기록돼요.`)) return;
  $("#select").disabled = true;
  $("#status").textContent = "키를 발급하고 노션에 기록하는 중이에요...";
  const r = await fetch("/api/admin/trial/select", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids: [...picked] }) }).then((r) => r.json()).catch((e) => ({ error: e.message }));
  if (r.error) { $("#status").innerHTML = `<span class="error">⚠ ${esc(r.error)}</span>`; renderCount(); return; }
  $("#status").textContent = `✅ ${r.results.filter((x) => x.key).length}명 선정 완료! 아래 안내문을 복사해서 한 분씩 보내주세요.`;
  $("#results").innerHTML = r.results.map((x) => x.error ? `<p class="error">${esc(x.id)}: ${esc(x.error)}</p>` : `
    <div class="card" style="margin-bottom:10px;padding:12px 14px">
      <b>${esc(x.name)}</b> <span class="muted">${esc(x.contact)} · ${x.start} ~ ${x.end}</span>
      <textarea readonly rows="7" style="width:100%;margin-top:6px;font-size:12px">${esc(`${x.name}님, 네이버 블로그 도우미 무료 체험단에 선정되셨어요! 🎉

사용 기간: ${x.start} ~ ${x.end} (2주)
사용 키:
${x.key}

프로그램을 처음 켜면 나오는 [사용 키 입력] 화면에 위 키를 그대로 붙여넣어 주세요.
2주 동안 써보시고 솔직한 후기 부탁드려요 :)`)}</textarea>
    </div>`).join("");
  picked.clear();
  $("#load").click();
});
</script>
</body>
</html>
