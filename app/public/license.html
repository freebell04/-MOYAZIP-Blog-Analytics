<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>사용 키 입력</title>
<link rel="stylesheet" href="style.css" />
<script src="file-open-guard.js"></script>
<style>
  body { max-width: 520px; }
  textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 13px; }
  .error { color: var(--danger); }
  .ok { color: var(--green-dark); }
</style>
</head>
<body>
<section class="card" style="margin-top:40px">
  <div class="card-head">
    <h2>🔑 사용 키 입력</h2>
    <p class="hint" id="why">네이버 블로그 도우미를 쓰려면 사용 키가 필요해요. 체험단 선정 안내나 구매 안내로 받은 키를 붙여넣어 주세요.</p>
  </div>
  <textarea id="key" rows="4" placeholder="NBH-로 시작하는 키"></textarea>
  <button id="save" class="btn btn-primary" style="margin-top:10px">확인</button>
  <p id="msg" class="status-line"></p>
</section>
<script>
const $ = (s) => document.querySelector(s);
fetch("/api/license").then((r) => r.json()).then((st) => {
  if (st.ok) location.href = "/";
  else if (st.expired) $("#why").textContent = `사용 기간이 끝났어요 (${st.start} ~ ${st.end}). 계속 쓰시려면 새 키를 입력해주세요.`;
});
$("#save").addEventListener("click", async () => {
  const r = await fetch("/api/license", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: $("#key").value }) }).then((r) => r.json());
  if (!r.ok) { $("#msg").innerHTML = `<span class="error">${r.reason}</span>`; return; }
  $("#msg").innerHTML = `<span class="ok">✅ ${r.name}님, 확인됐어요! ${r.start} ~ ${r.end} (남은 기간 ${r.daysLeft}일)</span>`;
  setTimeout(() => (location.href = "/"), 1200);
});
</script>
</body>
</html>
