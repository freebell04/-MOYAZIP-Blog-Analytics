<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>사용 키 입력</title>
<link rel="stylesheet" href="style.css" />
<script src="file-open-guard.js"></script>
<style>
  body { max-width: 520px; }
  textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 13px; }
  .error { color: var(--danger); }
  .ok { color: var(--green-dark); }
</style>
</head>
<body>
<section class="card" style="margin-top:40px">
  <div class="card-head">
    <h2>🔑 사용 키 입력</h2>
    <p class="hint" id="why">네이버 블로그 도우미를 쓰려면 사용 키가 필요해요. 체험단 선정 안내나 구매 안내로 받은 키를 붙여넣어 주세요.</p>
  </div>
  <textarea id="key" rows="4" placeholder="NBH-로 시작하는 키"></textarea>
  <button id="save" class="btn btn-primary" style="margin-top:10px">확인</button>
  <p id="msg" class="status-line"></p>
</section>

<section class="card" id="trial-box" hidden>
  <div class="card-head">
    <h2>🎁 무료 체험 2주 시작하기</h2>
    <p class="hint">키가 없어도 돼요. 이름과 내 네이버 블로그를 넣으면 <b>오늘부터 2주</b> 바로 쓸 수 있어요. (블로그와 컴퓨터마다 한 번만 가능해요)</p>
  </div>
  <label class="field-label">이름 (또는 닉네임)</label>
  <input id="t-name" autocomplete="off" placeholder="예: 모야" />
  <label class="field-label">네이버 블로그 주소 또는 아이디</label>
  <input id="t-blog" autocomplete="off" placeholder="예: blog.naver.com/내아이디" />
  <button id="t-start" class="btn btn-primary" style="margin-top:10px">무료 체험 시작</button>
  <p id="t-msg" class="status-line"></p>
</section>
<script>
const $ = (s) => document.querySelector(s);
// 선정 안내문의 링크(?key=...)로 들어오면 키가 미리 입력돼 있다 (확인 버튼은 직접 누른다)
const preKey = new URLSearchParams(location.search).get("key");
if (preKey) { $("#key").value = preKey; history.replaceState(null, "", location.pathname); }
fetch("/api/license").then((r) => r.json()).then((st) => {
  if (st.trial) $("#trial-box").hidden = false;
  if (st.ok) location.href = "/";
  else if (st.expired) $("#why").textContent = `사용 기간이 끝났어요 (${st.start} ~ ${st.end}). 계속 쓰시려면 새 키를 입력해주세요.`;
});
$("#t-start").addEventListener("click", async () => {
  $("#t-start").disabled = true;
  $("#t-msg").textContent = "체험을 시작하는 중이에요...";
  const r = await fetch("/api/license/trial", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: $("#t-name").value, blog: $("#t-blog").value }) }).then((r) => r.json()).catch(() => ({ ok: false, reason: "연결하지 못했어요." }));
  $("#t-start").disabled = false;
  if (!r.ok) { $("#t-msg").innerHTML = `<span class="error">${r.reason}</span>`; return; }
  $("#t-msg").innerHTML = `<span class="ok">✅ ${r.name}님, ${r.existing ? "이미 시작한 체험이 있어서 이어서 쓸게요" : "무료 체험이 시작됐어요"}! ${r.start} ~ ${r.end} (남은 기간 ${r.daysLeft}일)</span>`;
  setTimeout(() => (location.href = "/"), 1500);
});
$("#save").addEventListener("click", async () => {
  const r = await fetch("/api/license", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: $("#key").value }) }).then((r) => r.json());
  if (!r.ok) { $("#msg").innerHTML = `<span class="error">${r.reason}</span>`; return; }
  $("#msg").innerHTML = `<span class="ok">✅ ${r.name}님, 확인됐어요! ${r.start} ~ ${r.end} (남은 기간 ${r.daysLeft}일)</span>`;
  setTimeout(() => (location.href = "/"), 1200);
});
</script>
</body>
</html>
