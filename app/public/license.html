<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>사용 키 입력</title>
<link rel="stylesheet" href="style.css" />
<script src="file-open-guard.js"></script>
<style>
  body { max-width: 520px; }
  textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 13px; }
  .error { color: var(--danger); }
  .ok { color: var(--green-dark); }
</style>
</head>
<body>
<section class="card" style="margin-top:40px">
  <div class="card-head">
    <h2>🔑 사용 키 입력</h2>
    <p class="hint" id="why">네이버 블로그 도우미를 쓰려면 사용 키가 필요해요. 체험단 선정 안내나 구매 안내로 받은 키를 붙여넣어 주세요.</p>
  </div>
  <textarea id="key" rows="4" placeholder="NBH-로 시작하는 키"></textarea>
  <button id="save" class="btn btn-primary" style="margin-top:10px">확인</button>
  <p id="msg" class="status-line"></p>
</section>

<section class="card" id="trial-box" hidden>
  <div class="card-head">
    <h2>🎁 아직 키가 없다면</h2>
    <p class="hint">무료 체험 신청 페이지에서 이름과 블로그를 넣으면 <b>오늘부터 2주</b> 쓸 수 있어요. 신청이 끝나면 <b>"🚀 내 프로그램에서 바로 시작"</b> 버튼으로 이 프로그램에 키가 자동으로 들어가요.</p>
  </div>
  <a id="t-link" class="btn btn-primary" href="#" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">무료 체험 신청하러 가기</a>
</section>
<script>
const $ = (s) => document.querySelector(s);
// 선정 안내문의 링크(?key=...)로 들어오면 키가 미리 입력돼 있다 (확인 버튼은 직접 누른다)
const preKey = new URLSearchParams(location.search).get("key");
if (preKey) { $("#key").value = preKey; history.replaceState(null, "", location.pathname); setTimeout(() => $("#save").click(), 300); }
fetch("/api/license").then((r) => r.json()).then((st) => {
  if (st.trial) { $("#trial-box").hidden = false; $("#t-link").href = st.trialUrl || "#"; }
  if (st.ok) location.href = "/";
  else if (st.expired) $("#why").textContent = `사용 기간이 끝났어요 (${st.start} ~ ${st.end}). 계속 쓰시려면 새 키를 입력해주세요.`;
});
// 설정을 저장하면 프로그램이 스스로 다시 켜진다 → 다시 응답할 때까지 기다렸다가 메인 화면으로
function waitRestart() {
  const wait = setInterval(async () => {
    try {
      const s = await fetch("/api/setup", { cache: "no-store" }).then((x) => x.json());
      if (s.configured) { clearInterval(wait); location.href = "/"; }
    } catch {}
  }, 1500);
}
$("#save").addEventListener("click", async () => {
  const r = await fetch("/api/license", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: $("#key").value }) }).then((r) => r.json());
  if (!r.ok) { $("#msg").innerHTML = `<span class="error">${r.reason}</span>`; return; }
  $("#msg").innerHTML = `<span class="ok">✅ ${r.name}님, 확인됐어요! ${r.start} ~ ${r.end} (남은 기간 ${r.daysLeft}일)${r.setup ? `<br>블로그 '${r.id}'로 자동 설정하는 중이에요. 잠시만 기다려주세요...` : ""}</span>`;
  if (r.setup) return waitRestart();
  setTimeout(() => (location.href = "/"), 1200);
});
</script>
</body>
</html>
