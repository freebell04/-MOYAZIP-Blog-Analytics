<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>처음 설정</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { max-width: 560px; }
  label { display: block; font-size: 13px; color: var(--ink-soft); margin: 14px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  .hint small { color: var(--ink-soft); }
  .error { color: var(--danger); }
  ol { padding-left: 20px; font-size: 14px; line-height: 1.8; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-badge">N</span>
    <div>
      <h1>네이버 블로그 도우미</h1>
      <p class="subtitle">처음 한 번만 설정하면 돼요</p>
    </div>
  </div>
</header>

<section class="card">
  <h2 style="margin-top:0">내 블로그 설정</h2>
  <label>네이버 블로그 아이디 (blog.naver.com/<b>여기</b>) — 블로그 주소를 통째로 붙여넣어도 돼요</label>
  <input id="blog-id" placeholder="예: myblog123 또는 https://blog.naver.com/myblog123" autocomplete="off" />
  <label>블로그 이름 (추천 문구·리포트에 표시돼요)</label>
  <input id="blog-name" placeholder="예: 오늘의 기록" />
  <button id="save" class="btn btn-primary btn-lg">저장하고 시작하기</button>
  <div id="msg" class="status-line"></div>
</section>

<section class="card">
  <h2 style="margin-top:0">저장한 다음에는</h2>
  <ol>
    <li>프로그램이 잠깐 다시 시작돼요 (자동)</li>
    <li>화면 오른쪽 위 <b>[네이버 로그인]</b>을 눌러 뜨는 크롬 창에서 <b>내 네이버 계정</b>으로 로그인해요</li>
    <li><b>이웃 소통</b>에서 [새로 불러오기], <b>성과 통계</b>는 열면 자동으로 불러와요</li>
  </ol>
  <p class="hint"><small>로그인 정보와 기록은 모두 이 컴퓨터의 <code>data</code> 폴더에만 저장돼요. 다른 사람에게 이 폴더를 주지 마세요.</small></p>
</section>

<script>
const $ = (s) => document.querySelector(s);
fetch("/api/setup").then((r) => r.json()).then((c) => {
  if (c.blogId) $("#blog-id").value = c.blogId;
  if (c.blogName && c.blogName !== "내 블로그") $("#blog-name").value = c.blogName;
  if (c.configured) $("#msg").textContent = "이미 설정되어 있어요. 바꾸면 프로그램이 다시 시작돼요.";
});
$("#save").addEventListener("click", async () => {
  $("#save").disabled = true;
  const r = await fetch("/api/setup", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ blogId: $("#blog-id").value, blogName: $("#blog-name").value }),
  }).then((r) => r.json()).catch(() => ({ error: "저장 중 오류가 났어요." }));
  if (r.error) { $("#msg").innerHTML = `<span class="error">⚠ ${r.error}</span>`; $("#save").disabled = false; return; }
  $("#msg").textContent = `✅ '${r.blogId}'로 저장했어요. 다시 시작하는 중...`;
  // 서버가 다시 켜지면 메인 화면으로
  const wait = setInterval(async () => {
    try {
      const s = await fetch("/api/setup").then((x) => x.json());
      if (s.configured) { clearInterval(wait); location.href = "/"; }
    } catch {}
  }, 1500);
});
</script>
</body>
</html>
