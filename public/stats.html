<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>성과 통계</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { max-width: 1040px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .error { color: var(--danger); }
  .muted { color: var(--ink-soft); }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: 13px; color: var(--ink-soft); }
  .kpi b { display: block; font-size: 26px; color: var(--ink); line-height: 1.25; font-variant-numeric: tabular-nums; }
  .delta { font-size: 12px; font-weight: 700; }
  .up { color: var(--green-dark); }
  .down { color: var(--danger); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .card .sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 12px; }
  section.card { margin-bottom: 16px; }

  /* 차트 */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid line { stroke: #eceef1; stroke-width: 1; }
  .chart .axis text { fill: #8a8f98; font-size: 11px; }
  .chart .line { fill: none; stroke: var(--green); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .area { fill: var(--green); opacity: .08; }
  .chart .bar { fill: var(--green); }
  .chart .bar.dim { fill: #b9ecd0; }
  .chart .dot { fill: var(--green); stroke: #fff; stroke-width: 2; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .cross { stroke: #9aa0a6; stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .lbl { fill: var(--ink); font-size: 11px; font-weight: 700; }
  .tip { position: absolute; pointer-events: none; background: #1f2328; color: #fff; font-size: 12px; line-height: 1.45; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .1s; z-index: 5; }
  .tip.show { opacity: 1; }
  .legend-note { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .legend-note .pdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--green); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--green); vertical-align: -1px; margin-right: 4px; }

  /* 가로 막대 목록 */
  .hbars { display: flex; flex-direction: column; gap: 6px; }
  .hbar { display: grid; grid-template-columns: minmax(120px, 42%) 1fr 58px; gap: 10px; align-items: center; font-size: 13px; }
  .hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .track { height: 10px; background: #f1f3f5; border-radius: 4px; overflow: hidden; }
  .hbar .fill { height: 100%; background: var(--green); border-radius: 0 4px 4px 0; }
  .hbar .fill.alt { background: #7fd9a8; }
  .hbar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; margin-left: 4px; }
  .tag.gap { background: #fff3e0; color: #b25e00; }
  .tag.ok { background: var(--green-tint); color: var(--green-dark); }
  .tag.search { background: #e8f1ff; color: #2463c9; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; color: var(--ink-soft); }
  .seg button.on { background: var(--green-tint); color: var(--green-dark); font-weight: 700; }
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }

  /* 분석 */
  .insights { display: flex; flex-direction: column; gap: 8px; }
  .insight { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .tips { margin: 0; padding-left: 20px; font-size: 14px; }
  .tips li { margin: 6px 0; }
  .ideas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .idea { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fff; }
  .idea .kind { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; display: inline-block; margin-bottom: 6px; }
  .kind.gap { background: #fff3e0; color: #b25e00; }
  .kind.series { background: #e8f1ff; color: #2463c9; }
  .kind.top { background: var(--green-tint); color: var(--green-dark); }
  .kind.trend { background: #f3e8ff; color: #7a3dc8; }
  .kind.cross { background: #e6f7f7; color: #0f7a7a; }
  .kind.season { background: #fdecef; color: #c2334f; }
  .idea .ex { margin: 6px 0 0; padding-left: 16px; font-size: 12px; color: var(--ink-soft); }
  .idea .ex a { color: var(--ink-soft); }
  .kw-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .kw { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #f3e8ff; color: #5b2a9a; cursor: default; }
  .kw b { font-weight: 700; margin-left: 2px; }
  .kw.covered { background: var(--bg); color: var(--ink-soft); }
  .idea b { display: block; font-size: 14px; margin-bottom: 4px; }
  .idea p { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .nbox { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #fafbfc; }
  .nset { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; margin-bottom: 10px; }
  .nset label { font-size: 12px; color: var(--ink-soft); display: flex; flex-direction: column; gap: 4px; }
  .nset input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px; }
  #notion-where a { color: var(--green-dark); }
  @media (max-width: 800px) { .nset { grid-template-columns: 1fr; } }
  table.data { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: right; }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  details.tbl { margin-top: 8px; font-size: 12px; color: var(--ink-soft); }

  .goal { display: grid; grid-template-columns: 150px 1fr 170px; gap: 12px; align-items: center; font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .goal:last-child { border-bottom: 0; }
  .goal .gname { font-weight: 700; color: var(--ink); }
  .goal .gtrack { position: relative; height: 12px; background: #f1f3f5; border-radius: 4px; }
  .goal .gfill { height: 100%; background: var(--green); border-radius: 4px; max-width: 100%; }
  .goal .gpace { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #1f2328; }
  .goal .gval { text-align: right; font-variant-numeric: tabular-nums; }
  .goal .gval small { display: block; color: var(--ink-soft); }
  .goal-edit { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 8px 0; }
  .goal-edit label { font-size: 12px; color: var(--ink-soft); }
  .goal-edit input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  table.early { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.early th, table.early td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.early th { color: var(--ink-soft); font-weight: 500; background: #fafafa; }
  table.early td.t { text-align: left; white-space: normal; max-width: 280px; }
  table.early .spark { display: inline-flex; gap: 2px; align-items: flex-end; height: 22px; vertical-align: middle; }
  table.early .spark i { display: block; width: 7px; background: var(--green); border-radius: 2px 2px 0 0; }
  table.early .spark i.na { background: #e3e5e8; height: 3px !important; }
  .scroll-x { overflow-x: auto; }
  .rate { font-weight: 700; }
  .rate.ok { color: var(--green-dark); }
  .rate.no { color: var(--danger); }
  .memo-row td { background: #fafbfc; }
  .memo-form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 0; }
  .memo-form label { font-size: 12px; color: var(--ink-soft); display: flex; flex-direction: column; gap: 4px; }
  .memo-form textarea { min-height: 70px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px; resize: vertical; }
  .memo-view { font-size: 12px; color: var(--ink-soft); white-space: normal; text-align: left; }
  .nudge { background: #fff8e6; border: 1px solid #ffe2a8; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 10px; }

  @media (max-width: 800px) {
    .goal { grid-template-columns: 1fr; gap: 4px; }
    .goal .gval { text-align: left; }
    .goal-edit, .memo-form { grid-template-columns: 1fr 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid2, .ideas { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-badge">N</span>
    <div>
      <h1>성과 통계</h1>
      <p class="subtitle">조회수 · 유입 경로 · 다음 콘텐츠 추천</p>
    </div>
  </div>
  <div class="login-box">
    <a href="neighbors.html" class="btn btn-outline">이웃 소통</a>
    <a href="index.html" class="btn btn-outline">글쓰기 스튜디오</a>
  </div>
</header>

<section class="card">
  <div class="toolbar">
    <button id="refresh-btn" class="btn btn-primary">통계 새로 불러오기</button>
    <a id="excel-btn" class="btn btn-outline" href="/api/stats/excel">📥 엑셀 다운로드</a>
    <button id="notion-week" class="btn btn-outline" data-n="week">📝 노션에 주간 기록</button>
    <button id="notion-month" class="btn btn-outline" data-n="month">📝 노션에 월간 기록</button>
    <button class="btn btn-outline btn-sm" data-n="toggle" title="노션 저장 위치 설정">⚙️ 노션 설정</button>
    <div id="status" class="status-line" style="margin:0"></div>
  </div>
  <p class="sub" id="notion-where" style="margin:8px 0 0"></p>
  <div id="notion-settings" class="nbox" hidden></div>
  <div id="kpis" class="kpis"></div>
</section>

<div id="content"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => (n == null ? "-" : Number(n).toLocaleString("ko-KR"));
const md = (s) => { const d = new Date(s + "T00:00:00"); return `${d.getMonth() + 1}/${d.getDate()}`; };
let S = { data: null, goals: null, suggestedGoals: null, history: null, editGoals: false, openMemo: null, refPeriod: "week", qPeriod: "all" };
let pollTimer = null;

async function load() {
  const r = await fetch("/api/stats").then((r) => r.json());
  const sig = JSON.stringify([r.data && r.data.updatedAt, r.goals, r.history, r.trends && [r.trends.postCount, r.trends.ideas.length]]);
  const changed = sig !== load.sig;
  load.sig = sig;
  Object.assign(S, { data: r.data, goals: r.goals, suggestedGoals: r.suggestedGoals, history: r.history, trends: r.trends });
  renderStatus(r.state);
  if (typeof renderNotion === "function") renderNotion();
  if (changed) render();
  const busy = r.state.running;
  if (busy && !pollTimer) pollTimer = setInterval(load, 1500);
  if (!busy && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  // 오늘 처음 열었으면 자동으로 불러오기
  if (!busy && !r.state.error && (!r.data || r.data.today !== todayStr()) && !load.auto) { load.auto = true; refresh(); }
}
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

function renderStatus(st) {
  const el = $("#status");
  $("#refresh-btn").disabled = st.running;
  $("#excel-btn").style.pointerEvents = S.data ? "" : "none";
  $("#excel-btn").style.opacity = S.data ? "" : ".5";
  if (st.running) el.textContent = "⏳ " + st.progress;
  else if (st.error) el.innerHTML = `<span class="error">⚠ ${esc(st.error)}</span>`;
  else if (S.data) el.textContent = `${new Date(S.data.updatedAt).toLocaleString("ko-KR")} 기준`;
  else el.textContent = "아직 불러온 통계가 없어요.";
}

async function refresh() {
  await fetch("/api/stats/refresh", { method: "POST" });
  load();
}

// ---------------- 차트 (단일 계열, 브랜드 초록) ----------------
const tip = document.createElement("div");
tip.className = "tip";

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

/**
 * 세로 막대 또는 선 차트. points: [{label, value, tip, marker?}]
 * opts: {type: "bar"|"line", height, showEvery, highlightLast, labelMax}
 */
function chart(el, points, opts = {}) {
  const W = 640, H = opts.height || 220, L = 40, R = 10, T = 16, B = 26;
  const iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(1, ...points.map((p) => p.value)));
  const x = (i) => L + (points.length === 1 ? iw / 2 : (opts.type === "bar" ? (i + 0.5) * (iw / points.length) : (i * iw) / (points.length - 1)));
  const y = (v) => T + ih - (v / max) * ih;
  const ticks = [0, max / 2, max];
  let g = `<g class="grid">${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>`;
  g += `<g class="axis">${ticks.map((t) => `<text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join("")}`;
  const every = opts.showEvery || Math.ceil(points.length / 8);
  points.forEach((p, i) => { if (i % every === 0 || i === points.length - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(p.label)}</text>`; });
  g += `</g>`;

  if (opts.type === "bar") {
    const bw = Math.max(4, Math.min(28, iw / points.length - 4));
    points.forEach((p, i) => {
      const h = Math.max(0, (p.value / max) * ih);
      const x0 = x(i) - bw / 2, y0 = T + ih - h, r = Math.min(4, bw / 2, h);
      // 윗부분만 둥근 막대 (바닥은 기준선에 붙임)
      const d = h <= 0 ? "" : `M${x0},${T + ih} V${y0 + r} Q${x0},${y0} ${x0 + r},${y0} H${x0 + bw - r} Q${x0 + bw},${y0} ${x0 + bw},${y0 + r} V${T + ih} Z`;
      const dim = opts.highlightLast && i !== points.length - 1 ? " dim" : "";
      g += `<path class="bar${dim}" d="${d}"/>`;
    });
  } else {
    const path = points.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.value)}`).join(" ");
    g += `<path class="area" d="${path} L${x(points.length - 1)},${T + ih} L${x(0)},${T + ih} Z"/>`;
    g += `<path class="line" d="${path}"/>`;
    points.forEach((p, i) => { if (p.marker) g += `<circle class="dot" cx="${x(i)}" cy="${y(p.value)}" r="4.5"/>`; });
  }
  // 최댓값 하나만 직접 라벨
  if (opts.labelMax !== false) {
    const mi = points.reduce((b, p, i) => (p.value > points[b].value ? i : b), 0);
    g += `<text class="lbl" x="${x(mi)}" y="${y(points[mi].value) - 8}" text-anchor="middle">${fmt(points[mi].value)}</text>`;
  }
  // 호버: 크로스헤어 + 툴팁 (막대보다 넓은 히트 영역)
  const step = points.length > 1 ? iw / (opts.type === "bar" ? points.length : points.length - 1) : iw;
  g += `<line class="cross" x1="0" x2="0" y1="${T}" y2="${T + ih}" style="display:none"/>`;
  points.forEach((p, i) => { g += `<rect class="hit" data-i="${i}" x="${x(i) - step / 2}" y="${T}" width="${step}" height="${ih + B}"/>`; });

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "")}">${g}</svg>`;
  el.classList.add("chart");
  const svg = el.querySelector("svg"), cross = svg.querySelector(".cross");
  svg.addEventListener("mousemove", (e) => {
    const r = e.target.closest(".hit");
    if (!r) return;
    const i = +r.dataset.i, p = points[i];
    const scale = svg.getBoundingClientRect().width / W;
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.style.display = "";
    tip.innerHTML = p.tip;
    el.appendChild(tip);
    tip.style.left = x(i) * scale + "px";
    tip.style.top = y(p.value) * scale + "px";
    tip.classList.add("show");
  });
  svg.addEventListener("mouseleave", () => { tip.classList.remove("show"); cross.style.display = "none"; });
}

function hbars(items, { value = (x) => x.cv, name = (x) => x.name, extra = () => "", alt = () => false, unit = "회" } = {}) {
  const max = Math.max(1, ...items.map(value));
  return `<div class="hbars">${items.map((it) => `<div class="hbar">
      <div class="name" title="${esc(name(it))}">${esc(name(it))}${extra(it)}</div>
      <div class="track"><div class="fill ${alt(it) ? "alt" : ""}" style="width:${(value(it) / max) * 100}%"></div></div>
      <div class="val">${fmt(value(it))}${unit}</div>
    </div>`).join("")}</div>`;
}

function dataTable(headers, rows) {
  return `<details class="tbl"><summary>표로 보기</summary><table class="data"><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></details>`;
}

// ---------------- 렌더 ----------------
function render() {
  const d = S.data;
  if (!d) { $("#kpis").innerHTML = ""; $("#content").innerHTML = ""; return; }
  const a = d.analysis, s = a.summary;
  const delta = (v) => v == null ? "" : `<span class="delta ${v >= 0 ? "up" : "down"}">${v >= 0 ? "▲" : "▼"} ${Math.abs(v)}%</span>`;
  const projPct = s.projectedMonth && s.lastMonthCv ? Math.round(((s.projectedMonth - s.lastMonthCv) / s.lastMonthCv) * 1000) / 10 : null;
  $("#kpis").innerHTML = `
    <div class="kpi">지난주 조회수<b>${fmt(s.lastWeekCv)}</b>${delta(s.weekChange)} <span class="muted">전주 ${fmt(s.prevWeekCv)}</span></div>
    <div class="kpi">이번 달 누적<b>${fmt(s.monthToDate)}</b><span class="muted">예상 ${fmt(s.projectedMonth)}회</span> ${delta(projPct)}</div>
    <div class="kpi">지난달 조회수<b>${fmt(s.lastMonthCv)}</b><span class="muted">${esc(d.lastMonth)}</span></div>
    <div class="kpi">검색 유입 비율<b>${s.searchShare ?? "-"}%</b><span class="muted">최근 30일 발행 ${s.posts30}개</span></div>`;

  const postDays = {};
  for (const p of d.posts) (postDays[p.date] ||= []).push(p.title);

  $("#content").innerHTML = `
    <section class="card" id="goals"></section>

    <section class="card">
      <h2>🧭 한눈에 보기</h2>
      <div class="insights">${a.insights.map((i) => `<div class="insight">${i.icon} ${esc(i.text)}</div>`).join("")}</div>
    </section>

    <section class="card">
      <h2>일별 조회수 (최근 30일)</h2>
      <p class="sub">점은 글을 발행한 날이에요. 마우스를 올리면 그날 공감·댓글과 올린 글이 보여요.</p>
      <div id="c-daily"></div>
      <div class="legend-note"><span class="pdot"></span>글 발행일</div>
      ${dataTable(["날짜", "요일", "조회수", "공감", "댓글", "이웃 증감", "발행 글"], d.daily.slice().reverse().map((x) => [x.date, x.dow, x.cv, x.like ?? "-", x.comment ?? "-", x.relation ?? "-", (postDays[x.date] || []).join(" / ")]))}
    </section>

    <div class="grid2">
      <section class="card">
        <h2>주별 조회수</h2>
        <p class="sub">월요일 시작 기준, 완료된 주만 (진한 막대 = 지난주)</p>
        <div id="c-weekly"></div>

const GOAL_FIELDS = [
  { k: "weeklyViews", label: "주간 조회수", unit: "회" },
  { k: "monthlyViews", label: "월간 조회수", unit: "회" },
  { k: "postsPerWeek", label: "주간 발행", unit: "개" },
  { k: "weeklyLikes", label: "주간 공감", unit: "개" },
  { k: "weeklyComments", label: "주간 댓글", unit: "개" },
];

const ymdLocal = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
function thisWeekMonday() {
  const t = new Date(S.data.today + "T00:00:00");
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return ymdLocal(t);
}

/** 이번 주·이번 달 진행 상황 (오늘은 아직 진행 중이라 '속도' 계산에서 반쯤만 친다) */
function progressNow() {
  const d = S.data;
  const mon = thisWeekMonday();
  const wk = d.daily.filter((x) => x.date >= mon);
  const mo = d.daily.filter((x) => x.date.startsWith(d.today.slice(0, 7)));
  const now = new Date();
  const dayFrac = (now.getHours() * 60 + now.getMinutes()) / 1440;
  const weekElapsed = (wk.length - 1 + dayFrac) / 7;
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const monthElapsed = (mo.length - 1 + dayFrac) / daysInMonth;
  const sumOf = (a, k) => a.reduce((s, x) => s + (x[k] || 0), 0);
  return {
    weeklyViews: { now: sumOf(wk, "cv"), pace: weekElapsed },
    monthlyViews: { now: sumOf(mo, "cv"), pace: monthElapsed, projected: d.analysis.summary.projectedMonth },
    postsPerWeek: { now: d.posts.filter((p) => p.date >= mon).length, pace: weekElapsed },
    weeklyLikes: { now: sumOf(wk, "like"), pace: weekElapsed },
    weeklyComments: { now: sumOf(wk, "comment"), pace: weekElapsed },
  };
}

function renderGoals() {
  const el = $("#goals");
  const goals = S.goals;
  const sg = S.suggestedGoals || {};
  if (!goals || S.editGoals) {
    const src = goals || sg;
    el.innerHTML = `<h2>🎯 목표(KPI) 설정</h2>
      <p class="sub">${goals ? "목표를 고쳐서 저장하세요." : "아직 목표가 없어요. 최근 성과보다 10~20% 높게 잡은 추천값이 채워져 있어요."}</p>
      <div class="goal-edit">${GOAL_FIELDS.map((g) => `<label>${g.label}<input type="number" min="0" data-goal="${g.k}" value="${src[g.k] ?? ""}"><small>추천 ${fmt(sg[g.k])}</small></label>`).join("")}</div>
      <button class="btn btn-primary btn-sm" data-act="save-goals">목표 저장</button>
      <button class="btn btn-outline btn-sm" data-act="fill-suggest">추천 목표로 채우기</button>
      ${goals ? `<button class="btn btn-outline btn-sm" data-act="cancel-goals">취소</button>` : ""}`;
    return;
  }
  const p = progressNow();
  const row = (g) => {
    const target = goals[g.k];
    if (!target) return "";
    const cur = p[g.k];
    const ratio = cur.now / target;
    const expected = Math.round(target * cur.pace);
    const onTrack = cur.now >= expected;
    const note = g.k === "monthlyViews" && cur.projected
      ? `이 속도면 ${fmt(cur.projected)}회`
      : onTrack ? "속도 👍" : `지금쯤 ${fmt(expected)}${g.unit}이면 순조로워요`;
    return `<div class="goal">
      <div class="gname">${g.label}</div>
      <div class="gtrack" title="검은 선 = 지금쯤 와 있어야 할 위치"><div class="gfill" style="width:${Math.min(100, ratio * 100)}%"></div><div class="gpace" style="left:${Math.min(100, cur.pace * 100)}%"></div></div>
      <div class="gval"><b>${fmt(cur.now)}</b> / ${fmt(target)}${g.unit} (${Math.round(ratio * 100)}%)<small class="${onTrack ? "up" : "down"}">${note}</small></div>
    </div>`;
  };
  el.innerHTML = `<div class="head-row">
      <div><h2>🎯 목표 진행 상황</h2><p class="sub">이번 주(월~) · 이번 달 기준. 검은 선은 지금쯤 와 있어야 할 위치예요.</p></div>
      <button class="btn btn-outline btn-sm" data-act="edit-goals">목표 수정</button>
    </div>
    ${GOAL_FIELDS.map(row).join("")}`;
}

const notionReady = () => typeof N !== "undefined" && N.config && N.config.hasToken && N.config.target;
function notionLink(week) {
  const list = (typeof N !== "undefined" && N.log && N.log[`week:${week}`]) || [];
  const last = list[list.length - 1];
  return last ? `<a href="${esc(last.url)}" target="_blank" rel="noopener" title="${esc(last.title)}">열기 ↗</a>` : "-";
}

function renderRecords() {
  const el = $("#records");
  const weeks = S.history ? Object.values(S.history.weeks).sort((a, b) => b.week.localeCompare(a.week)) : [];
  if (!weeks.length) { el.innerHTML = `<h2>📒 주간 기록 & 회고</h2><p class="muted">통계를 불러오면 주마다 자동으로 기록돼요.</p>`; return; }
  const lastFull = weeks.find((w) => !w.inProgress);
  const nudge = lastFull && !(lastFull.memo && (lastFull.memo.did || lastFull.memo.good || lastFull.memo.next))
    ? `<div class="nudge">✍️ 지난주(${md(lastFull.week)}~) 회고를 아직 안 적었어요. 조회수 ${fmt(lastFull.cv)}회${lastFull.goalViews ? ` (목표 ${fmt(lastFull.goalViews)}회의 ${Math.round((lastFull.cv / lastFull.goalViews) * 100)}%)` : ""} — 무엇을 했고 뭐가 통했는지 3줄만 남겨보세요. <button class="btn btn-primary btn-sm" data-act="open-memo" data-week="${lastFull.week}">지금 적기</button></div>`
    : "";
  const rate = (w) => {
    if (!w.goalViews) return `<span class="muted">-</span>`;
    const r = Math.round((w.cv / w.goalViews) * 100);
    return `<span class="rate ${r >= 100 ? "ok" : w.inProgress ? "" : "no"}">${r}%${r >= 100 ? " 🎉" : ""}</span>`;
  };
  const memoText = (m) => m ? [m.did && `한 일: ${m.did}`, m.good && `잘 된 점: ${m.good}`, m.next && `다음: ${m.next}`].filter(Boolean).map(esc).join("<br>") : "";
  el.innerHTML = `<h2>📒 주간 기록 & 회고</h2>

      저장 위치: 이 컴퓨터(data/stats-history.json) · 엑셀 '주간 기록' 시트 · ${notionReady() ? "<b>노션</b> (회고 저장 시 자동 반영)" : "노션은 ⚙️ 노션 설정을 하면 자동 반영돼요"}</p>
    ${nudge}
    <div class="scroll-x"><table class="early">
      <tr><th style="text-align:left">주</th><th>조회수</th><th>목표</th><th>달성률</th><th>❤️</th><th>💬</th><th>이웃 증감</th><th>발행</th><th style="text-align:left">회고</th><th>노션</th><th></th></tr>
      ${weeks.map((w) => `<tr>
        <td class="t">${md(w.week)}~${w.inProgress ? ` <span class="tag ok">이번 주</span>` : ""}</td>
        <td><b>${fmt(w.cv)}</b></td>
        <td>${fmt(w.goalViews)}</td>
        <td>${rate(w)}</td>
        <td>${w.like ?? "-"}</td>
        <td>${w.comment ?? "-"}</td>

        <td>${notionLink(w.week)}</td>
        <td><button class="btn btn-outline btn-sm" data-act="open-memo" data-week="${w.week}">${w.memo ? "수정" : "적기"}</button></td>

        <button class="btn btn-primary btn-sm" data-act="save-memo" data-week="${w.week}">회고 저장</button>
        <button class="btn btn-outline btn-sm" data-act="close-memo">닫기</button>
      </td></tr>` : ""}`).join("")}
    </table></div>`;
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "edit-goals") { S.editGoals = true; renderGoals(); }
  if (act === "cancel-goals") { S.editGoals = false; renderGoals(); }
  if (act === "fill-suggest") document.querySelectorAll("[data-goal]").forEach((i) => (i.value = (S.suggestedGoals || {})[i.dataset.goal] ?? ""));
  if (act === "save-goals") {
    const body = {};
    document.querySelectorAll("[data-goal]").forEach((i) => (body[i.dataset.goal] = i.value));
    await fetch("/api/stats/goals", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    S.editGoals = false;
    load();
  }
  if (act === "open-memo") { S.openMemo = b.dataset.week; renderRecords(); const t = document.querySelector("[data-memo]"); if (t) t.focus(); }
  if (act === "close-memo") { S.openMemo = null; renderRecords(); }
  if (act === "save-memo") {
    const body = { week: b.dataset.week };
    document.querySelectorAll("[data-memo]").forEach((t) => (body[t.dataset.memo] = t.value));
    const toNotion = !!(document.querySelector("#memo-notion") || {}).checked;
    body.notion = toNotion;
    b.disabled = true;
    b.textContent = toNotion ? "저장 중 (노션 반영 중...)" : "저장 중...";
    const r = await fetch("/api/stats/memo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());
    S.openMemo = null;
    if (r.notion) {
      const what = { replaced: "기존 리포트의 회고를 바꿨어요", appended: "기존 리포트에 회고를 붙였어요", created: "새 페이지로 저장했어요" }[r.notion.action];
      $("#status").innerHTML = `✅ 회고 저장 · 노션에 ${what}: <a href="${esc(r.notion.url)}" target="_blank" rel="noopener">${esc(r.notion.title)}</a>`;
    } else if (r.notionError) {
      $("#status").innerHTML = `<span class="error">회고는 저장했지만 노션 반영 실패: ${esc(r.notionError)}</span>`;
    } else {
      $("#status").textContent = "✅ 회고를 저장했어요.";
    }
    if (typeof loadNotion === "function") loadNotion();
    load();
  }
});


function demoLine(demo) {
  const t = demo.find((x) => x.age === "전체");
  if (!t) return "";
  const f = Math.round((t.f / ((t.f || 0) + (t.m || 0) || 1)) * 100);
  return `여성 ${f}% · 남성 ${100 - f}%`;
}

function renderRefs() {
  const d = S.data;
  const refs = (S.refPeriod === "week" ? d.week : d.month).referers.slice(0, 12);
  $("#refs").innerHTML = hbars(refs, {
    extra: (r) => (r.isSearch ? `<span class="tag search">검색</span>` : ""),
    alt: (r) => !r.isSearch,
  }) + `<p class="legend-note">진한 막대 = 검색 유입 · 연한 막대 = 그 외 (메인, 블로그 홈, 외부 사이트 등)</p>`;
}

function renderQueries() {
  const d = S.data;
  let list;
  if (S.qPeriod === "all") list = d.analysis.queries;
  else list = (S.qPeriod === "week" ? d.week : d.month).queries.filter((q) => q.query !== "기타");
  const gaps = new Set(d.analysis.ideas.filter((i) => i.type === "gap").map((i) => i.keyword));
  $("#queries").innerHTML = hbars(list.slice(0, 15), {
    name: (q) => q.query,
    extra: (q) => (gaps.has(q.query) ? `<span class="tag gap">글 없음</span>` : ""),
  });
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest(".seg button");
  if (b) {
    const key = b.parentElement.dataset.seg;
    S[key] = b.dataset.v;
    b.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    key === "refPeriod" ? renderRefs() : renderQueries();
  }
});
$("#refresh-btn").addEventListener("click", refresh);
// ---------------- 노션 기록 ----------------
let N = { config: null, log: {}, open: false, busy: false };

async function loadNotion() {
  const r = await fetch("/api/notion/config").then((r) => r.json());
  N.config = r.config;
  N.log = r.log || {};
  renderNotion();
  if (S.data && typeof renderRecords === "function") renderRecords();
}

function renderNotion() {
  const c = N.config || {};
  const ready = c.hasToken && c.target;
  $("#notion-week").disabled = N.busy || !ready || !S.data;
  $("#notion-month").disabled = N.busy || !ready || !S.data;
  $("#notion-where").innerHTML = ready
    ? `저장 위치: <a href="${esc(c.target.url || c.targetUrl)}" target="_blank" rel="noopener">${c.target.type === "database" ? "🗂️" : "📄"} ${esc(c.target.title)}</a>`
    : `<span class="error">노션 저장 위치가 아직 없어요 → ⚙️ 노션 설정</span>`;

  const box = $("#notion-settings");
  box.hidden = !N.open;
  if (!N.open) return;
  const recent = Object.entries(N.log).flatMap(([k, list]) => list.map((x) => ({ k, ...x }))).sort((a, b) => b.savedAt.localeCompare(a.savedAt)).slice(0, 5);
  box.innerHTML = `
    <h3 style="margin:0 0 6px;font-size:15px">⚙️ 노션 설정</h3>
    <p class="sub" style="margin:0 0 10px">리포트를 저장할 노션 위치를 정해요. 사람마다 자기 노션 토큰과 위치를 넣으면 돼요 (이 컴퓨터에만 저장돼요).</p>
    <div class="nset">
      <label>① 노션 통합 토큰 (내부 통합 시크릿)
        <input id="n-token" type="password" autocomplete="off" placeholder="${c.hasToken ? `저장됨 (${esc(c.tokenHint)}) — 바꿀 때만 입력` : "ntn_ 또는 secret_ 로 시작하는 값"}">
      </label>
      <label>② 저장 위치 — 노션 페이지 또는 데이터베이스 링크
        <input id="n-url" type="url" placeholder="https://www.notion.so/..." value="${esc(c.targetUrl || "")}">
      </label>
    </div>
    <button class="btn btn-primary btn-sm" data-n="save-config">연결 테스트 & 저장</button>
    <span id="n-msg" class="status-line" style="margin-left:8px"></span>
    <details style="margin-top:12px;font-size:13px">
      <summary>처음이라면: 토큰 만들고 위치 연결하는 법 (3분)</summary>
      <ol style="margin:8px 0 0;padding-left:20px;line-height:1.8">
        <li><a href="https://www.notion.so/profile/integrations" target="_blank" rel="noopener">notion.so/profile/integrations</a> → <b>새 통합 만들기</b> (유형: 내부) → 이름 예: "블로그 리포트"</li>
        <li>만든 통합의 <b>기능</b>에서 "콘텐츠 읽기 / 업데이트 / 입력"이 켜져 있는지 확인 → <b>내부 통합 시크릿</b> 복사 → ①에 붙여넣기</li>
        <li>리포트를 모을 노션 페이지(또는 데이터베이스)를 열고 오른쪽 위 <b>··· → 연결(Connections) → 방금 만든 통합 추가</b></li>
        <li>그 페이지의 <b>링크 복사</b> → ②에 붙여넣기 → [연결 테스트 & 저장]</li>
        <li>그래도 모르겠다면? <a href="https://blog.naver.com/freebell04/224339733098" target="_blank" rel="noopener">제 블로그</a>에서 참고하면 빠르게 가능!</li>
      </ol>
      <p class="muted" style="margin:6px 0 0">페이지 링크면 그 아래 하위 페이지로, 데이터베이스 링크면 새 행으로 저장돼요. 데이터베이스에 날짜 속성이 있으면 기간이 자동으로 들어가요.</p>
    </details>
    ${recent.length ? `<div style="margin-top:12px;font-size:13px"><b>최근 저장한 기록</b><ul style="margin:4px 0 0;padding-left:20px">${recent.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a> <span class="muted">${new Date(x.savedAt).toLocaleString("ko-KR")} · ${esc(x.target)}</span></li>`).join("")}</ul></div>` : ""}`;
}

async function saveToNotion(period, force = false) {
  N.busy = true;
  renderNotion();
  $("#status").textContent = `📝 노션에 ${period === "month" ? "월간" : "주간"} 기록 저장 중...`;
  try {
    const r = await fetch("/api/notion/save", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ period, force }),
    }).then((r) => r.json());
    if (r.exists) {
      const last = r.exists[r.exists.length - 1];
      N.busy = false;
      if (confirm(`'${r.title}'은(는) ${new Date(last.savedAt).toLocaleString("ko-KR")}에 이미 저장했어요.\n한 번 더 저장하면 새 페이지가 하나 더 생겨요. 저장할까요?`)) return saveToNotion(period, true);
      $("#status").innerHTML = `이미 저장된 기록: <a href="${esc(last.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`;
      return;
    }
    if (r.error) { $("#status").innerHTML = `<span class="error">⚠ ${esc(r.error)}</span>`; return; }
    $("#status").innerHTML = `✅ 노션에 저장했어요: <a href="${esc(r.saved.url)}" target="_blank" rel="noopener">${esc(r.saved.title)}</a>`;
  } finally {
    N.busy = false;
    loadNotion();
  }
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-n]");
  if (!b) return;
  const act = b.dataset.n;
  if (act === "toggle") { N.open = !N.open; renderNotion(); }
  if (act === "week") saveToNotion("week");
  if (act === "month") saveToNotion("month");
  if (act === "save-config") {
    const msg = $("#n-msg");
    msg.textContent = "노션에 연결하는 중...";
    const r = await fetch("/api/notion/config", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: $("#n-token").value, targetUrl: $("#n-url").value }),
    }).then((r) => r.json());
    if (r.error) { msg.innerHTML = `<span class="error">⚠ ${esc(r.error)}</span>`; return; }
    N.config = r.config;
    renderNotion();
    $("#n-msg").innerHTML = `✅ 연결됐어요! ${r.config.target.type === "database" ? "데이터베이스" : "페이지"} '${esc(r.config.target.title)}'에 저장돼요.`;
  }
});

loadNotion();


load();
</script>
